<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5c8a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5541c"/>
    </marker>
  </defs>
  <rect width="980" height="550" fill="#fff"/>

  <!-- Human -->
  <rect x="330" y="18" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="16" font-weight="bold">Human architect</text>
  <text x="480" y="62" text-anchor="middle" font-size="12.5" font-style="italic">hypotheses · priorities · review · go/no-go</text>

  <!-- Trace model -->
  <rect x="40" y="140" width="340" height="200" rx="6" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.8"/>
  <text x="210" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b5c8a">Trace model</text>
  <text x="210" y="181" text-anchor="middle" font-size="12" font-style="italic" fill="#2b5c8a">fast · exploratory · minutes per run</text>
  <g font-size="12.5" fill="#222" stroke="#2b5c8a" stroke-width="1">
    <rect x="62" y="195" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="62" y="230" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="62" y="265" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="62" y="300" width="296" height="28" rx="3" fill="#fff"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#222">
    <text x="210" y="214">exp/* branch + feature switch</text>
    <text x="210" y="249">SPEC FastWarm sweeps on server</text>
    <text x="210" y="284">IPC · PMU / TMA bottleneck breakdown</text>
    <text x="210" y="319">design-space exploration (DSE)</text>
  </g>
  <!-- inner loop -->
  <path d="M368,311 C392,311 392,204 368,204" fill="none" stroke="#2b5c8a" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="396" y="262" font-size="11.5" font-style="italic" fill="#2b5c8a" transform="rotate(-90 396 262)" text-anchor="middle">inner loop</text>

  <!-- RTL -->
  <rect x="600" y="140" width="340" height="200" rx="6" fill="#fbf1ea" stroke="#b5541c" stroke-width="1.8"/>
  <text x="770" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#b5541c">RTL</text>
  <text x="770" y="181" text-anchor="middle" font-size="12" font-style="italic" fill="#b5541c">cycle-accurate · ground truth · hours per run</text>
  <g font-size="12.5" fill="#222" stroke="#b5541c" stroke-width="1">
    <rect x="622" y="195" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="622" y="230" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="622" y="265" width="296" height="28" rx="3" fill="#fff"/>
    <rect x="622" y="300" width="296" height="28" rx="3" fill="#fff"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#222">
    <text x="770" y="214">feature ported behind the same switch</text>
    <text x="770" y="249">regression · Linux boot</text>
    <text x="770" y="284">synthesis: area · timing · cell count</text>
    <text x="770" y="319">RTL performance (PMU) cross-check</text>
  </g>

  <!-- Trace -> RTL -->
  <line x1="380" y1="205" x2="600" y2="205" stroke="#2b5c8a" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="490" y="190" text-anchor="middle" font-size="12">⑤ validated feature</text>
  <text x="490" y="224" text-anchor="middle" font-size="12" font-style="italic">+ spec, switch, expected IPC</text>
  <!-- RTL -> Trace -->
  <line x1="600" y1="290" x2="380" y2="290" stroke="#b5541c" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="490" y="275" text-anchor="middle" font-size="12">⑥ calibration</text>
  <text x="490" y="308" text-anchor="middle" font-size="12" font-style="italic">model–RTL IPC gap,</text>
  <text x="490" y="322" text-anchor="middle" font-size="12" font-style="italic">area / timing limits</text>

  <!-- Human arrows -->
  <path d="M370,80 L370,110 L210,110 L210,140" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="290" y="104" text-anchor="middle" font-size="12">① hypothesis, workloads</text>
  <path d="M590,80 L590,110 L770,110 L770,140" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="680" y="104" text-anchor="middle" font-size="12">④ go / no-go</text>

  <!-- AI agents band -->
  <rect x="40" y="385" width="900" height="50" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="490" y="407" text-anchor="middle" font-size="16" font-weight="bold">AI agents</text>
  <text x="490" y="425" text-anchor="middle" font-size="12.5" font-style="italic">implement · launch sweeps (fleet.sh) · analyze PMU/TMA · write records</text>
  <line x1="210" y1="385" x2="210" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="202" y="368" text-anchor="end" font-size="12">② implement &amp; sweep</text>
  <line x1="770" y1="385" x2="770" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="762" y="368" text-anchor="end" font-size="12">⑤ port &amp; verify</text>
  <line x1="320" y1="340" x2="320" y2="385" stroke="#2b5c8a" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="328" y="368" font-size="11.5" font-style="italic" fill="#2b5c8a">③ results</text>
  <line x1="880" y1="340" x2="880" y2="385" stroke="#b5541c" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="872" y="368" text-anchor="end" font-size="11.5" font-style="italic" fill="#b5541c">PPA, boot logs</text>

  <!-- Records band -->
  <rect x="40" y="470" width="900" height="44" rx="6" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="490" y="489" text-anchor="middle" font-size="14" font-weight="bold">Records &amp; main</text>
  <text x="490" y="506" text-anchor="middle" font-size="12.5" font-style="italic">EXPLORATION.md (per experiment) · MAIN_RECORDS.md (perf + synthesis per merge) · LOG.md</text>
  <line x1="490" y1="435" x2="490" y2="470" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="498" y="457" font-size="12">⑦ record, merge to main</text>

  <!-- records -> human -->
  <path d="M940,492 L965,492 L965,49 L630,49" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a)"/>
  <text x="957" y="270" font-size="12" font-style="italic" transform="rotate(-90 957 270)" text-anchor="middle">evidence for next iteration</text>

  <!-- Caption -->
  <text x="490" y="542" text-anchor="middle" font-size="13" font-style="italic">Fig. 1. AI–Human co-design loop: the trace model explores cheaply, RTL validates and calibrates, and records close the loop.</text>
</svg>
