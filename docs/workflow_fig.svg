<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fff"/>

  <!-- Human -->
  <rect x="320" y="14" width="260" height="46" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="450" y="35" text-anchor="middle" font-size="16" font-weight="bold">Human</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" font-style="italic">hypothesis · review · go/no-go</text>
  <path d="M360,60 L360,90 L165,90 L165,115" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M540,60 L540,90 L735,90 L735,115" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Trace model -->
  <rect x="30" y="115" width="270" height="160" rx="6" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.8"/>
  <text x="165" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b5c8a">Trace model</text>
  <text x="165" y="162" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2b5c8a">fast · explore · minutes</text>
  <text x="165" y="192" text-anchor="middle" font-size="13">SPEC sweeps · IPC · TMA</text>
  <text x="165" y="212" text-anchor="middle" font-size="13">feature switch (exp/*)</text>
  <text x="165" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5c8a">cycle-level model</text>

  <!-- RTL -->
  <rect x="600" y="115" width="270" height="160" rx="6" fill="#fbf1ea" stroke="#b5541c" stroke-width="1.8"/>
  <text x="735" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#b5541c">RTL</text>
  <text x="735" y="162" text-anchor="middle" font-size="12.5" font-style="italic" fill="#b5541c">ground truth · hours</text>
  <text x="735" y="192" text-anchor="middle" font-size="13">Linux boot · regression</text>
  <text x="735" y="212" text-anchor="middle" font-size="13">synthesis: area · timing</text>
  <text x="735" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5541c">cycle-accurate</text>

  <!-- Lock-step coupling -->
  <line x1="300" y1="175" x2="600" y2="175" stroke="#2b5c8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="166" text-anchor="middle" font-size="12.5">validated feature + expected cycles</text>
  <line x1="600" y1="225" x2="300" y2="225" stroke="#b5541c" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="245" text-anchor="middle" font-size="12.5">per-cycle / PMU mismatch → recalibrate</text>
  <rect x="352" y="183" width="196" height="34" rx="17" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="450" y="205" text-anchor="middle" font-size="14" font-weight="bold">cycle-consistent lock-step</text>

  <!-- AI agents -->
  <rect x="30" y="320" width="840" height="56" rx="6" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
  <text x="450" y="343" text-anchor="middle" font-size="16" font-weight="bold">AI agents</text>
  <text x="450" y="362" text-anchor="middle" font-size="12.5" font-style="italic">implement on both sides · run sweeps · diff counters · write records · merge to main</text>
  <line x1="165" y1="320" x2="165" y2="275" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="735" y1="320" x2="735" y2="275" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M450,320 L450,262" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="458" y="300" font-size="12" font-style="italic">close every gap</text>

  <text x="450" y="412" text-anchor="middle" font-size="13" font-style="italic">Fig. 1. AI–Human loop: trace model and RTL are kept cycle-consistent, so cheap exploration transfers to RTL.</text>
</svg>
